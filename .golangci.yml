version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - noctx
    - revive
    - sqlclosecheck
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # httptest.NewRequest không nhận context là pattern chuẩn trong test Go;
      # dùng NewRequestWithContext ép go1.23 (go.mod hiện pin go1.22).
      - path: _test\.go
        linters:
          - noctx
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
