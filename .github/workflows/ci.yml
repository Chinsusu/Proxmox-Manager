name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then echo "$diff"; echo "run: gofmt -w ."; exit 1; fi
      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          diff=$(goimports -l .)
          if [ -n "$diff" ]; then echo "$diff"; echo "run: goimports -w ."; exit 1; fi
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pin tuong minh, khong dung "latest": action resolve "latest" ve
          # dong v1.x (1.64.8) trong khi .golangci.yml o day la config v2.
          # Ban local da verify sach voi v2.13.1 - giu dong bo hai ben.
          version: v2.13.1

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  openapi:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @stoplight/spectral-cli lint api/openapi.yaml
