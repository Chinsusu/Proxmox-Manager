name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then echo "$diff"; echo "run: gofmt -w ."; exit 1; fi
      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          diff=$(goimports -l .)
          if [ -n "$diff" ]; then echo "$diff"; echo "run: goimports -w ."; exit 1; fi
      - uses: golangci/golangci-lint-action@v7
        with:
          # golangci-lint-action v6 KHONG ho tro golangci-lint v2 (loi ro rang
          # tu action). .golangci.yml o day la config schema v2 (da migrate
          # bang `golangci-lint migrate`) nen bat buoc dung action v7+.
          # Pin tuong minh, khong dung "latest", de khop ban da verify local.
          version: v2.13.1

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  openapi:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @stoplight/spectral-cli lint api/openapi.yaml
